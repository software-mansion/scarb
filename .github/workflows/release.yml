name: Release

on:
  push:
    tags:
      - v[0-9]+.*

permissions:
  contents: read

jobs:
  check:
    uses: ./.github/workflows/_check-release.yml

  check-cairo-lang-versions:
    uses: ./.github/workflows/_check-cairo-lang-versions.yml

  release:
    uses: ./.github/workflows/_build-release.yml
    with:
      scarb-tag: ${{ github.ref_name }}
      full-verify: true

  draft:
    name: draft release
    runs-on: ubuntu-latest
    needs: [ check, check-cairo-lang-versions, release ]
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
        with:
          persist-credentials: false

      - name: Download artifacts
        uses: actions/download-artifact@3e5f45b2cfb9172054b4087a40e8e0b5a5461e7c # v8
        with:
          path: artifacts-dl

      - name: Unpack artifacts to staging directory
        run: |
          mkdir -p artifacts
          mv artifacts-dl/build-*/scarb-* artifacts/
          mv artifacts-dl/checksums/* artifacts/
          ls -lh artifacts/

      - name: Determine release notes start tag
        run: |
          if [[ "$RELEASE_TAG" == *-rc* ]]; then
            EXISTING_TAGS=$(gh release list --limit 1000 --exclude-drafts --json tagName --jq '.[].tagName')
          else
            EXISTING_TAGS=$(gh release list --limit 1000 --exclude-drafts --exclude-pre-releases --json tagName --jq '.[].tagName')
          fi

          # 1. Combine existing releases with the current tag being released
          # 2. Swap "-rc" for "~rc" so sort -V puts release candidates BEFORE the final
          #    release (v1.2.0~rc2 < v1.2.0), sort semantically, then swap back
          # 3. Remove duplicates (uniq)
          # 4. Find the current tag and grab it along with the 1 line before it (-B 1)
          # 5. Take the first line of that output (which is the previous tag)
          RELEASE_NOTES_START_TAG=$( (echo "$EXISTING_TAGS"; echo "$RELEASE_TAG") | sed 's/-rc/~rc/' | sort -V | sed 's/~rc/-rc/' | uniq | grep -B 1 -x "$RELEASE_TAG" | head -n 1 )

          # If it's the very first release, it will return itself.
          if [[ "$RELEASE_NOTES_START_TAG" == "$RELEASE_TAG" ]]; then
            RELEASE_NOTES_START_TAG=""
          fi

          echo "RELEASE_NOTES_START_TAG=${RELEASE_NOTES_START_TAG}" >> "$GITHUB_ENV"
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          RELEASE_TAG: ${{ github.ref_name }}

      - name: Draft GitHub release
        run: |
          gh release create \
            "${RELEASE_TAG}" \
            ./artifacts/* \
            --draft \
            --title "${RELEASE_TAG}" \
            --generate-notes \
            --verify-tag \
            --notes-start-tag "${RELEASE_NOTES_START_TAG}"
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          RELEASE_TAG: ${{ github.ref_name }}
          